name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bundle libraries for offline use
        run: |
          mkdir -p www/lib
          B=https://cdn.jsdelivr.net/npm
          curl -fL -o www/lib/three.min.js $B/three@0.128.0/build/three.min.js
          curl -fL -o www/lib/OrbitControls.js $B/three@0.128.0/examples/js/controls/OrbitControls.js
          curl -fL -o www/lib/TransformControls.js $B/three@0.128.0/examples/js/controls/TransformControls.js
          curl -fL -o www/lib/fengari-web.js $B/fengari-web@0.1.4/dist/fengari-web.js
          sed -i "s#$B/three@0.128.0/build/#lib/#; s#$B/three@0.128.0/examples/js/controls/#lib/#; s#$B/fengari-web@0.1.4/dist/#lib/#" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Force landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
